plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.friendscape.FriendscapePluginTest'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.friendscape'
// The Plugin Hub reads the version from runelite-plugin.properties, so the build does too
def pluginProperties = new Properties()
file('runelite-plugin.properties').withInputStream { pluginProperties.load(it) }
version = pluginProperties.getProperty('version')

def buildInfoDir = layout.buildDirectory.dir('generated/sources/buildInfo/java/main')
def generateBuildInfo = tasks.register('generateBuildInfo') {
	description = 'Generates BuildInfo.java holding the plugin version'
	def pluginVersion = project.version.toString()
	inputs.property('version', pluginVersion)
	outputs.dir(buildInfoDir)
	doLast {
		def source = buildInfoDir.get().file('com/friendscape/BuildInfo.java').asFile
		source.parentFile.mkdirs()
		source.text = """package com.friendscape;

/** Generated by the generateBuildInfo Gradle task; edit runelite-plugin.properties instead. */
final class BuildInfo
{
	static final String VERSION = "${pluginVersion}";

	private BuildInfo()
	{
	}
}
"""
	}
}
sourceSets.main.java.srcDir(generateBuildInfo)

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
	options.compilerArgs << '-Xlint:deprecation' << '-Werror'
}

def configureClientLaunch = { JavaExec task ->
	task.group = 'application'
	task.classpath = sourceSets.test.runtimeClasspath
	task.mainClass = pluginMainClass
	task.jvmArgs '-ea'
	// macOS-only: com.apple.eawt doesn't exist on Windows/Linux JDKs, where the flag would print a
	// JVM startup warning on every launch. jvmArgs() appends, so this adds the flag only on mac.
	if (System.getProperty('os.name').toLowerCase().startsWith('mac')) {
		task.jvmArgs '--add-opens=java.desktop/com.apple.eawt=ALL-UNNAMED'
	}
	task.args '--developer-mode', '--debug'
}

tasks.register('run', JavaExec) {
	description = 'Launches RuneLite in developer mode with this plugin sideloaded'
	configureClientLaunch(it)
}

tasks.register('runDev', JavaExec) {
	description = 'Like run, but points the plugin at the dev API host'
	configureClientLaunch(it)
	systemProperty 'friendscape.apiBase', 'https://dev.friendscape.cc/api/'
}

tasks.register('runStub', JavaExec) {
	description = 'Like run, but against a local stub API that shows every card state (test sources only)'
	configureClientLaunch(it)
	mainClass = 'com.friendscape.StubApi'
	// The stub re-reads its files from the source tree, so an edit shows on the next poll
	systemProperty 'friendscape.stubDir', file('src/test/resources/stub').absolutePath
	if (project.hasProperty('stubPort')) {
		systemProperty 'friendscape.stubPort', project.property('stubPort')
	}
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}

tasks.named('test') {
	systemProperty 'java.awt.headless', 'true'
}
